<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Packet Visualizer</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body {
        background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('bg_login.jpg') no-repeat center center fixed;
        background-size: cover;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #f8fafc;
    }

    .auth-box {
        background-color: rgba(30, 41, 59, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 0 25px rgba(250, 204, 21, 0.15), inset 0 0 15px rgba(250, 204, 21, 0.05);
        text-align: center;
        border: 1px solid rgba(250, 204, 21, 0.5);
        width: 400px;
        transition: all 0.3s ease;
    }
    
    .auth-box:hover {
        box-shadow: 0 0 45px rgba(250, 204, 21, 0.3), inset 0 0 25px rgba(250, 204, 21, 0.1);
        transform: translateY(-2px);
        border-color: rgba(250, 204, 21, 0.8);
    }

    h2 span {
        color: #facc15;
        text-shadow: 0 0 15px rgba(250, 204, 21, 0.6), 0 0 30px rgba(250, 204, 21, 0.4);
    }

    p {
        color: #94a3b8;
        font-size: 14px;
        margin-bottom: 25px;
    }

    .input-group {
        text-align: left;
        margin-bottom: 15px;
    }

    .input-group label {
        display: block;
        margin-bottom: 5px;
        color: #fde68a;
        font-size: 13px;
    }

    .input-group input,
    .input-group select {
        width: 100%;
        padding: 12px;
        border-radius: 6px;
        border: 1px solid #334155;
        background-color: #0f172a;
        color: white;
        outline: none;
    }

    /* ปรับแต่ง Dropdown สีเหลือง */
    .input-group select option {
        background: #1e293b;
        color: white;
    }

    .input-group input:focus,
    .input-group select:focus {
        border-color: #facc15;
        box-shadow: 0 0 15px rgba(250, 204, 21, 0.4) !important;
    }

    .auth-btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background-color: #facc15;
        color: #0f172a;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 10px;
        text-transform: uppercase;
        box-shadow: 0 0 15px rgba(250, 204, 21, 0.4);
    }

    .auth-btn:hover {
        background-color: #eab308;
        transform: scale(1.02);
        box-shadow: 0 0 25px rgba(250, 204, 21, 0.8);
    }

    .footer-links {
        margin-top: 20px;
        font-size: 13px;
    }

    .footer-links a {
        color: #facc15;
        text-decoration: none;
        font-weight: bold;
    }

    /* Cyber SweetAlert2 Custom Style */
    .cyber-popup {
        background: rgba(30, 41, 59, 0.85) !important;
        backdrop-filter: blur(16px) !important;
        -webkit-backdrop-filter: blur(16px) !important;
        border: 1px solid rgba(250, 204, 21, 0.5) !important;
        box-shadow: 0 0 40px rgba(250, 204, 21, 0.25), inset 0 0 20px rgba(250, 204, 21, 0.1) !important;
        border-radius: 16px !important;
    }

    .cyber-title {
        color: #facc15 !important;
        text-shadow: 0 0 15px rgba(250, 204, 21, 0.6) !important;
    }

    .cyber-confirm-btn {
        background-color: #facc15 !important;
        color: #0f172a !important;
        font-weight: bold !important;
        border-radius: 6px !important;
        border: none !important;
        box-shadow: 0 0 15px rgba(250, 204, 21, 0.5) !important;
        transition: all 0.3s ease !important;
        padding: 10px 24px !important;
    }

    .cyber-confirm-btn:hover {
        background-color: #eab308 !important;
        box-shadow: 0 0 25px rgba(250, 204, 21, 0.9) !important;
        transform: scale(1.05) !important;
    }
</style>

<body>
    <div class="auth-container">
        <div class="auth-box" id="loginBox">
            <h2>Packet<span>Dukjub</span></h2>
            <p>เข้าสู่ระบบเพื่อเริ่มดักจับแพ็กเก็ต</p>
            <form id="loginForm">
                <div class="input-group">
                    <label>ชื่อผู้ใช้งาน</label>
                    <input type="text" placeholder="Username" required>
                </div>
                <div class="input-group">
                    <label>รหัสผ่าน</label>
                    <input type="password" placeholder="Password" required>
                </div>
                <button type="submit" class="auth-btn" onclick="Login(event)">Sign In</button>
            </form>
            <div class="footer-links">
                <p>ยังไม่มีบัญชี? <a href="#" onclick="toggleAuth()">ลงทะเบียนใหม่</a></p>
            </div>
        </div>

        <div class="auth-box" id="registerBox" style="display: none;">
            <h2>Create<span>Account</span></h2>
            <p>สร้างบัญชีใหม่เพื่อเข้าใช้งานระบบ</p>
            <form id="registerForm">
                <div class="input-group">
                    <label>ชื่อผู้ใช้งาน</label>
                    <input type="text" placeholder="Username" id="registerName" required>
                </div>
                <div class="input-group">
                    <label>รหัสผ่าน</label>
                    <input type="password" placeholder="Password" id="registerPassword" required>
                </div>
                <div class="input-group">
                    <label>ยืนยันรหัสผ่าน</label>
                    <input type="password" placeholder="Confim Password" id="registerConfirmPassword" required>
                </div>
                <label style="color: red; display: none;" id="redText">รหัสผ่านไม่ตรงกัน</label>
                <button type="submit" class="auth-btn" onclick="Register(event)">Register</button>
            </form>
            <div class="footer-links">
                <p>มีบัญชีอยู่แล้ว? <a href="#" onclick="toggleAuth()">เข้าสู่ระบบ</a></p>
            </div>
        </div>
    </div>

    <script>
        const url = window.location.origin;
        axios.defaults.withCredentials = true;
        function toggleAuth() {
            const loginBox = document.getElementById('loginBox');
            const registerBox = document.getElementById('registerBox');

            if (loginBox.style.display === 'none') {
                loginBox.style.display = 'block';
                registerBox.style.display = 'none';
            } else {
                loginBox.style.display = 'none';
                registerBox.style.display = 'block';
            }
        }
        function Login(event) {
            event.preventDefault();
            const username = document.querySelector('#loginForm input[type="text"]').value;
            const password = document.querySelector('#loginForm input[type="password"]').value;

            axios.post(`${url}/auth/login`, { username, password })
                .then((res) => {
                    Swal.fire({
                        title: 'เข้าสู่ระบบสำเร็จ!',
                        text: 'กำลังพาท่านไปยังแดชบอร์ด...',
                        icon: 'success',
                        background: 'none',
                        color: '#f8fafc',
                        timer: 1500,
                        showConfirmButton: false,
                        customClass: { popup: 'cyber-popup', title: 'cyber-title' },
                        backdrop: `rgba(0,0,0,0.6)`
                    }).then(() => {
                        console.log(res);
                        checkRole();
                        document.getElementById('loginForm').reset();
                    });
                })
                .catch(err => {
                    Swal.fire({
                        title: 'เกิดข้อผิดพลาด',
                        text: err.response?.data?.message || 'เข้าสู่ระบบไม่สำเร็จ',
                        icon: 'error',
                        background: 'none',
                        color: '#f8fafc',
                        customClass: { popup: 'cyber-popup', title: 'cyber-title', confirmButton: 'cyber-confirm-btn' },
                        backdrop: `rgba(0,0,0,0.6)`
                    });
                });
        }
        function Register(event) {
            event.preventDefault();
            const username = document.getElementById('registerName').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;
            const redText = document.getElementById("redText");
            if (password != confirmPassword) {
                redText.style.display = 'block';
                return;
            }
            axios.post(`${url}/auth/register`, { username, password })
                .then((res) => {
                    Swal.fire({
                        title: 'ลงทะเบียนสำเร็จ!',
                        text: 'สามารถเข้าสู่ระบบด้วยบัญชีใหม่ได้ทันที',
                        icon: 'success',
                        background: 'none',
                        color: '#f8fafc',
                        customClass: { popup: 'cyber-popup', title: 'cyber-title', confirmButton: 'cyber-confirm-btn' },
                        backdrop: `rgba(0,0,0,0.6)`
                    }).then(() => {
                        console.log(res);
                        toggleAuth(); 
                        document.getElementById('registerForm').reset();
                    });
                })
                .catch((err) => { 
                    Swal.fire({
                        title: 'ลงทะเบียนไม่สำเร็จ',
                        text: err.response?.data?.message || 'เกิดข้อผิดพลาดบางอย่าง',
                        icon: 'error',
                        background: 'none',
                        color: '#f8fafc',
                        customClass: { popup: 'cyber-popup', title: 'cyber-title', confirmButton: 'cyber-confirm-btn' },
                        backdrop: `rgba(0,0,0,0.6)`
                    });
                    console.log(err);
                });
        }

        async function checkRole() {
            
            axios.get(`${url}/auth/me`)
                .then((res) => {
                    console.log(res.data.user)
                    if (res.data.user.role == "admin"){
                         window.location.href = 'admin.html';
                    }
                    else{
                        window.location.href = 'user.html';
                    }
                })
                .catch(err =>
                        console.error("ไม่ได้ล็อกอิน หรือเซสชันหมดอายุ")
                );
        }
        document.addEventListener('DOMContentLoaded', checkRole);
    </script>
</body>

</html>
